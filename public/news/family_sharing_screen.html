<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
:root {
  --violet:        #6C63FF;
  --violet-deep:   #4C46B8;
  --lavender:      #A78BFA;
  --mint:          #34D399;
  --coral:         #F87171;
  --amber:         #F59E0B;
  --ink:           #0B0D1E;
  --glass-border:  rgba(255, 255, 255, 0.22);
}

html, body { margin: 0; padding: 0; }

body {
  width: 1200px;
  height: 675px;
  overflow: hidden;
  font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
  color: #fff;
  -webkit-font-smoothing: antialiased;
}

.canvas {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--violet-deep) 0%, var(--violet) 50%, var(--lavender) 100%);
}

.orb { position: absolute; border-radius: 50%; filter: blur(4px); }
.orb-a { width: 620px; height: 620px; top: -220px; right: -140px; background: rgba(255,255,255,0.16); }
.orb-b { width: 520px; height: 520px; bottom: -240px; left: -120px; background: rgba(52,211,153,0.20); }

.stage {
  position: relative;
  width: 1000px;
  height: 500px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 64px;
}

/* iPhone frame, real settings screen recreated inside */
.phone {
  flex-shrink: 0;
  width: 300px;
  height: 620px;
  border-radius: 46px;
  padding: 10px;
  background: rgba(11,13,30,0.72);
  border: 1.5px solid var(--glass-border);
  box-shadow: 0 30px 60px rgba(11,13,30,0.40);
}
.shot {
  width: 100%;
  height: 100%;
  border-radius: 36px;
  overflow: hidden;
  display: block;
  object-fit: cover;
}

/* Copy panel */
.copy { width: 420px; flex-shrink: 0; }
.copy .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.6); margin-bottom: 14px; }
.copy h2 { font-size: 42px; font-weight: 800; line-height: 1.08; letter-spacing: -1px; margin: 0 0 16px; }
.copy p { font-size: 19px; line-height: 1.5; color: rgba(255,255,255,0.85); margin: 0; }
.copy .stat { display: inline-block; color: var(--mint); font-weight: 800; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>

    <div class="stage">
      <div class="phone">
        <img class="shot" src="family_sharing_screen_src.jpg" alt="">
      </div>

      <div class="copy">
        <div class="eyebrow">Family Sharing</div>
        <h2>Budget together.<br>Reach goals faster.</h2>
        <p>Partners who share a budget hit their goals <span class="stat">20% more often</span>. Every transaction is tagged with who added it — no more guessing who spent what.</p>
      </div>
    </div>
  </div>
</body>
</html>
