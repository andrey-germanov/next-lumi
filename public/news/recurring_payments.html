<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
:root {
  --violet:        #6C63FF;
  --violet-deep:   #4C46B8;
  --lavender:      #A78BFA;
  --mint:          #34D399;
  --coral:         #F87171;
  --amber:         #F59E0B;
  --ink:           #0B0D1E;
  --glass-border:  rgba(255, 255, 255, 0.22);
  --scr-bg:        #F4F3F9;
  --scr-ink:       #14161F;
}

html, body { margin: 0; padding: 0; }

body {
  width: 1200px;
  height: 675px;
  overflow: hidden;
  font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
  color: #fff;
  -webkit-font-smoothing: antialiased;
}

.canvas {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--violet-deep) 0%, var(--violet) 50%, var(--lavender) 100%);
}

.orb { position: absolute; border-radius: 50%; filter: blur(4px); }
.orb-a { width: 620px; height: 620px; top: -220px; right: -140px; background: rgba(255,255,255,0.16); }
.orb-b { width: 520px; height: 520px; bottom: -240px; left: -120px; background: rgba(52,211,153,0.20); }

.stage { position: relative; width: 1000px; height: 500px; }

/* ── Phone frames (fanned: two smaller/tilted behind, one dominant centered) ── */
.phone {
  position: absolute;
  border-radius: 42px;
  padding: 9px;
  background: rgba(11,13,30,0.72);
  border: 1.5px solid var(--glass-border);
}
.phone.side { width: 246px; height: 508px; border-radius: 36px; padding: 8px; box-shadow: 0 20px 40px rgba(11,13,30,0.34); }
.phone.main { width: 278px; height: 575px; box-shadow: 0 30px 60px rgba(11,13,30,0.42); }

.phone.left  { left: calc(50% - 150px); top: 50%; transform: translate(-370px, -46%) rotate(-8deg); z-index: 1; }
.phone.right { left: calc(50% - 150px); top: 50%; transform: translate(30px, -46%) rotate(8deg); z-index: 2; }
.phone.main  { left: calc(50% - 150px); top: 50%; transform: translate(calc(-50% - 45px), -50%); z-index: 3; }

/* Copy panel */
.copy { position: absolute; right: -30px; top: 50%; transform: translateY(-50%); width: 320px; }
.copy .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.6); margin-bottom: 14px; }
.copy h2 { font-size: 33px; font-weight: 800; line-height: 1.12; letter-spacing: -0.8px; margin: 0 0 16px; }
.copy p { font-size: 16.5px; line-height: 1.5; color: rgba(255,255,255,0.85); margin: 0; }
.copy .stat { display: inline-block; color: var(--mint); font-weight: 800; }

.shot {
  width: 100%;
  height: 100%;
  border-radius: 33px;
  overflow: hidden;
  display: block;
  object-fit: cover;
}
.phone.main .shot { border-radius: 36px; }

/* ── Shared screen pieces ── */
.px { padding: 0 16px; }
.top-time { font-size: 10px; font-weight: 700; padding: 10px 14px 0; }
.icon-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px 0; }
.circle-btn { width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
.icon-row .right { display: flex; gap: 6px; }
.icon-row .right .circle-btn { width: 22px; height: 22px; }

.hero-amt { font-size: 30px; font-weight: 800; letter-spacing: -1px; padding: 10px 16px 0; }
.hero-sub { display: flex; align-items: center; gap: 6px; padding: 4px 16px 0; font-size: 10px; color: rgba(20,22,31,0.55); }
.hero-sub .up { color: var(--coral); font-weight: 700; }

.sec-label { font-size: 9px; font-weight: 700; letter-spacing: 0.6px; color: rgba(20,22,31,0.42); text-transform: uppercase; padding: 12px 16px 6px; }

.row {
  display: flex; align-items: center; gap: 9px;
  background: #fff; border-radius: 12px; padding: 9px 12px; margin: 0 16px 6px;
}
.row .chip { width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; }
.row .info { flex: 1; min-width: 0; }
.row .name { font-size: 11px; font-weight: 700; }
.row .meta { font-size: 8.5px; color: rgba(20,22,31,0.45); margin-top: 1px; }
.row .meta.rej { color: var(--coral); }
.row .meta.ok { color: #16A34A; }
.row .amt { font-size: 11px; font-weight: 800; flex-shrink: 0; }

.chart-card { margin: 8px 16px 0; background: #fff; border-radius: 14px; padding: 12px 14px; }
.chart-num { font-size: 22px; font-weight: 800; letter-spacing: -0.6px; }
.chart-date { font-size: 9px; color: rgba(20,22,31,0.45); margin-top: 2px; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>

    <div class="stage">

      <!-- LEFT (behind): real screenshot — Recurring Payments detail screen -->
      <div class="phone side left">
        <img class="shot" src="recurring_payments_src_detail.png" alt="">
      </div>

      <!-- RIGHT (behind): real screenshot — Family Activity + Recurring Payments summary -->
      <div class="phone side right">
        <img class="shot" src="recurring_payments_src_family.png" alt="">
      </div>

      <!-- MAIN (front): real screenshot — Home dashboard -->
      <div class="phone main">
        <img class="shot" src="recurring_payments_src_home.png" alt="">
      </div>

      <div class="copy">
        <div class="eyebrow">Recurring Payments</div>
        <h2>Recurring payments,<br>finally under control.</h2>
        <p>Lumi spots your recurring charges automatically and lines them up before they're due. <span class="stat">Confirm or reject</span> each one — nothing gets logged without you knowing.</p>
      </div>

    </div>
  </div>
</body>
</html>
