<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
:root {
  --violet:        #6C63FF;
  --violet-deep:   #4C46B8;
  --lavender:      #A78BFA;
  --mint:          #34D399;
  --coral:         #F87171;
  --amber:         #F59E0B;
  --ink:           #0B0D1E;
  --glass-border:  rgba(255, 255, 255, 0.22);
}

html, body { margin: 0; padding: 0; }

body {
  width: 1200px;
  height: 675px;
  overflow: hidden;
  font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

.canvas {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #F2F2F7;
}


.head { position: relative; text-align: center; }
.eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 1.8px; text-transform: uppercase; color: var(--violet); margin-bottom: 14px; }
h1 { font-size: 56px; font-weight: 800; line-height: 1.05; letter-spacing: -1.8px; margin: 0; }
h1 .accent { color: var(--violet); }

.row { position: relative; display: flex; gap: 56px; margin-top: 34px; }

.opt { display: flex; flex-direction: column; align-items: center; }
.tile {
}
.tile img { width: 250px; height: 250px; display: block; filter: drop-shadow(0 14px 22px rgba(76,70,184,0.28)); }

.num {
  margin-top: 18px;
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--violet); color: #fff;
  font-size: 21px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 16px rgba(108,99,255,0.35);
}

.pill {
  position: relative;
  margin-top: 30px;
  display: flex; align-items: center; gap: 10px;
  padding: 14px 26px;
  border-radius: 999px;
  background: var(--violet); color: #fff;
  box-shadow: 0 14px 28px rgba(108,99,255,0.35);
  font-size: 22px; font-weight: 700; letter-spacing: -0.3px;
}
.pill svg { width: 24px; height: 24px; display: block; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="head">
      <h1>Help us pick<br><span class="accent">Lumi's new icon</span></h1>
    </div>

    <div class="row">
      <div class="opt"><div class="tile"><img src="app_icon_vote_src_safe.png" alt=""></div><div class="num">1</div></div>
      <div class="opt"><div class="tile"><img src="app_icon_vote_src_wallet.png" alt=""></div><div class="num">2</div></div>
      <div class="opt"><div class="tile"><img src="app_icon_vote_src_piggy.png" alt=""></div><div class="num">3</div></div>
    </div>

    <div class="pill">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4L3 11l6 2.5L11.5 20 14 15l7-11z"/><path d="M9 13.5L21 4"/></svg>
      Vote in our Telegram channel
    </div>
  </div>
</body>
</html>
