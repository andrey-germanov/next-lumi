<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
:root {
  --violet:        #6C63FF;
  --violet-deep:   #4C46B8;
  --lavender:      #A78BFA;
  --mint:          #34D399;
  --coral:         #F87171;
  --amber:         #F59E0B;
  --ink:           #0B0D1E;
  --ink-soft:      #181D30;

  --glass:         rgba(255, 255, 255, 0.09);
  --glass-strong:  rgba(255, 255, 255, 0.15);
  --glass-border:  rgba(255, 255, 255, 0.22);
}

html, body { margin: 0; padding: 0; }

body {
  width: 1200px;
  height: 675px;
  overflow: hidden;
  font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
  color: #fff;
  -webkit-font-smoothing: antialiased;
}

.canvas {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--violet-deep) 0%, var(--violet) 50%, var(--lavender) 100%);
}

.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(4px);
}
.orb-a { width: 620px; height: 620px; top: -220px; right: -140px; background: rgba(255,255,255,0.16); }
.orb-b { width: 520px; height: 520px; bottom: -240px; left: -120px; background: rgba(52,211,153,0.20); }

.stage {
  position: relative;
  width: 1000px;
  height: 500px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 40px;
}

.badge {
  flex-shrink: 0;
  width: 250px;
  height: 250px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.18);
  border: 2px solid rgba(255,255,255,0.45);
  box-shadow: 0 20px 44px rgba(11,13,30,0.32);
}
.badge svg { width: 142px; height: 142px; display: block; }

/* Link glyph — reads the two subjects as "connected to one account", not a collage. */
.link {
  flex-shrink: 0;
  width: 56px;
  height: 56px;
  opacity: 0.85;
}


.pill {
  position: absolute;
  bottom: 56px;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 30px;
  border-radius: 999px;
  background: rgba(11,13,30,0.45);
  border: 1.5px solid rgba(255,255,255,0.28);
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.4px;
  white-space: nowrap;
}
</style>
</head>
<body>
  <div class="canvas">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>

    <div class="stage">
      <div class="badge">
        <!-- Two overlapping flat person glyphs — sharing one account, drawn geometric to match the app's idiom. -->
        <svg viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="92" cy="86" r="32" fill="#ffffff" fill-opacity="0.55"/>
          <path d="M40 208 C40 148 63 122 92 122 C121 122 144 148 144 208 Z" fill="#ffffff" fill-opacity="0.55"/>
          <circle cx="152" cy="98" r="36" fill="#ffffff" fill-opacity="0.95"/>
          <path d="M92 216 C92 150 118 128 152 128 C186 128 212 150 212 216 Z" fill="#ffffff" fill-opacity="0.95"/>
        </svg>
      </div>

      <svg class="link" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="28" r="13" stroke="#ffffff" stroke-width="5"/>
        <circle cx="36" cy="28" r="13" stroke="#ffffff" stroke-width="5"/>
      </svg>

      <div class="badge">
        <!-- Target rings + checkmark — the goal, reached, echoing the "budgeting together" success framing. -->
        <svg viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="120" cy="120" r="92" stroke="#ffffff" stroke-opacity="0.30" stroke-width="14"/>
          <circle cx="120" cy="120" r="60" stroke="#ffffff" stroke-opacity="0.55" stroke-width="14"/>
          <circle cx="120" cy="120" r="34" fill="var(--mint)"/>
          <path d="M103 121 L116 135 L142 103" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

    <div class="pill">Family Sharing</div>
  </div>
</body>
</html>
