<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
:root {
  --violet:        #6C63FF;
  --violet-deep:   #4C46B8;
  --lavender:      #A78BFA;
  --mint:          #34D399;
  --coral:         #F87171;
  --amber:         #F59E0B;
  --ink:           #0B0D1E;
  --glass-border:  rgba(255, 255, 255, 0.22);
}
html, body { margin: 0; padding: 0; }
body { width: 1200px; height: 675px; overflow: hidden; }
.canvas {
  position: relative; width: 100%; height: 100%;
  background: linear-gradient(135deg, var(--violet-deep) 0%, var(--violet) 50%, var(--lavender) 100%);
}
.orb { position: absolute; border-radius: 50%; filter: blur(4px); }
.orb-a { width: 620px; height: 620px; top: -220px; right: -140px; background: rgba(255,255,255,0.16); }
.orb-b { width: 520px; height: 520px; bottom: -240px; left: -120px; background: rgba(11,13,30,0.18); }
svg.scene { position: absolute; inset: 0; }
</style>
</head>
<body>
<div class="canvas">
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>

  <svg class="scene" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
        <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#0B0D1E" flood-opacity="0.32"/>
      </filter>
      <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0B0D1E" flood-opacity="0.30"/>
      </filter>
    </defs>

    <!-- ── Chart card: mood bars, then the dose change ─────────────── -->
    <g filter="url(#shadow)">
      <rect x="470" y="250" width="590" height="300" rx="34" fill="#FFFFFF"/>
    </g>
    <g>
      <!-- grid -->
      <g stroke="#E6E4F5" stroke-width="2">
        <line x1="520" y1="330" x2="1010" y2="330"/>
        <line x1="520" y1="400" x2="1010" y2="400"/>
        <line x1="520" y1="470" x2="1010" y2="470"/>
      </g>
      <!-- before the change: uneven, warm -->
      <g>
        <rect x="530" y="430" width="26" height="70" rx="7" fill="#FB923C"/>
        <rect x="568" y="392" width="26" height="108" rx="7" fill="#F5B325"/>
        <rect x="606" y="436" width="26" height="64" rx="7" fill="#FB923C"/>
        <rect x="644" y="396" width="26" height="104" rx="7" fill="#F5B325"/>
        <rect x="682" y="430" width="26" height="70" rx="7" fill="#FB923C"/>
        <rect x="720" y="384" width="26" height="116" rx="7" fill="#F5B325"/>
        <rect x="758" y="380" width="26" height="120" rx="7" fill="#F5B325"/>
        <rect x="796" y="428" width="26" height="72" rx="7" fill="#FB923C"/>
      </g>
      <!-- the change -->
      <line x1="840" y1="300" x2="840" y2="506" stroke="#6C63FF" stroke-width="4" stroke-dasharray="9 9" stroke-linecap="round"/>
      <circle cx="840" cy="300" r="9" fill="#6C63FF"/>
      <!-- after: steady, green -->
      <g fill="#34D399">
        <rect x="858" y="330" width="26" height="170" rx="7"/>
        <rect x="896" y="338" width="26" height="162" rx="7"/>
        <rect x="934" y="326" width="26" height="174" rx="7"/>
        <rect x="972" y="322" width="26" height="178" rx="7"/>
      </g>
      <line x1="520" y1="502" x2="1010" y2="502" stroke="#D4D1EC" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- ── The pill, centred over the card ─────────────────────────── -->
    <g filter="url(#soft)" transform="translate(612 262) rotate(-38) scale(0.72)">
      <!-- orange half -->
      <path d="M0 -50 L-80 -50 A50 50 0 0 0 -80 50 L0 50 Z" fill="#FF9533"/>
      <!-- white half -->
      <path d="M0 -50 L80 -50 A50 50 0 0 1 80 50 L0 50 Z" fill="#FFFFFF"/>
      <!-- highlight -->
      <rect x="22" y="-30" width="70" height="16" rx="8" fill="#DCD7FF" stroke="#6C63FF" stroke-opacity="0.55" stroke-width="3"/>
    </g>


    <!-- ── Reminder badge, pinned to the card's top-right corner ───── -->
    <g transform="translate(1046 256) rotate(8)">
      <g filter="url(#soft)">
        <rect x="-46" y="-46" width="92" height="92" rx="22" fill="#FFFFFF"/>
      </g>
      <!-- bells -->
      <path d="M-26 -14 A14 14 0 0 1 -10 -30 Z" fill="#6C63FF"/>
      <path d="M26 -14 A14 14 0 0 0 10 -30 Z" fill="#6C63FF"/>
      <!-- legs -->
      <line x1="-16" y1="24" x2="-22" y2="31" stroke="#4C46B8" stroke-width="5" stroke-linecap="round"/>
      <line x1="16" y1="24" x2="22" y2="31" stroke="#4C46B8" stroke-width="5" stroke-linecap="round"/>
      <!-- face -->
      <circle cx="0" cy="2" r="24" fill="#FFFFFF" stroke="#6C63FF" stroke-width="6"/>
      <!-- hands -->
      <line x1="0" y1="2" x2="0" y2="-11" stroke="#0B0D1E" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="2" x2="10" y2="8" stroke="#FF9533" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="2" r="3" fill="#0B0D1E"/>
    </g>

    <!-- ── The doctor ──────────────────────────────────────────────── -->
    <g transform="translate(170 110)">
      <!-- floor shadow -->
      <ellipse cx="120" cy="462" rx="92" ry="12" fill="#0B0D1E" opacity="0.22"/>

      <!-- legs -->
      <rect x="96"  y="318" width="20" height="132" rx="10" fill="#F2C9A5"/>
      <rect x="128" y="318" width="20" height="132" rx="10" fill="#F2C9A5"/>
      <!-- socks -->
      <rect x="96"  y="392" width="20" height="50" rx="8" fill="#F87171"/>
      <rect x="128" y="392" width="20" height="50" rx="8" fill="#F87171"/>
      <!-- shoes -->
      <path d="M90 444 h30 a6 6 0 0 1 6 6 v6 h-44 a8 8 0 0 1 8 -12 z" fill="#0B0D1E"/>
      <path d="M124 444 h30 a6 6 0 0 1 6 6 v6 h-44 a8 8 0 0 1 8 -12 z" fill="#0B0D1E"/>

      <!-- dress showing under the coat -->
      <path d="M92 150 L152 150 L162 326 L82 326 Z" fill="#181D30"/>

      <!-- white coat -->
      <path d="M78 126 Q122 110 166 126 L188 330 L146 330 L136 168 L108 168 L98 330 L56 330 Z"
            fill="#FFFFFF" stroke="#E2DFF7" stroke-width="3" stroke-linejoin="round"/>
      <!-- lapels -->
      <path d="M108 126 L122 176 L136 126" fill="none" stroke="#E2DFF7" stroke-width="4" stroke-linejoin="round"/>
      <!-- pocket + pen -->
      <rect x="146" y="196" width="24" height="22" rx="4" fill="#F4F2FF" stroke="#E2DFF7" stroke-width="2"/>
      <rect x="152" y="186" width="5" height="18" rx="2.5" fill="#6C63FF"/>

      <!-- back arm (holding the clipboard) -->
      <path d="M84 140 Q74 210 66 238" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
      <path d="M84 140 Q74 210 66 238" fill="none" stroke="#E2DFF7" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

      <!-- clipboard -->
      <g transform="translate(-10 150) rotate(-10)">
        <rect x="0" y="0" width="74" height="96" rx="10" fill="#FFFFFF" stroke="#6C63FF" stroke-width="4"/>
        <rect x="22" y="-8" width="30" height="16" rx="5" fill="#6C63FF"/>
        <rect x="14" y="26" width="46" height="6" rx="3" fill="#C7C2F5"/>
        <rect x="14" y="42" width="36" height="6" rx="3" fill="#C7C2F5"/>
        <polyline points="14,78 28,66 40,72 58,52" fill="none" stroke="#34D399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <!-- hand on the clipboard -->
      <circle cx="64" cy="240" r="11" fill="#F2C9A5"/>

      <!-- front arm, gesturing toward the chart -->
      <path d="M160 140 Q190 196 214 206" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
      <path d="M160 140 Q190 196 214 206" fill="none" stroke="#E2DFF7" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
      <circle cx="222" cy="206" r="11" fill="#F2C9A5"/>

      <!-- neck -->
      <rect x="111" y="96" width="22" height="26" rx="8" fill="#E9B98F"/>
      <!-- head -->
      <circle cx="122" cy="74" r="34" fill="#F2C9A5"/>
      <!-- hair: cap + bun -->
      <path d="M88 76 Q86 34 124 36 Q160 38 158 70 Q140 56 112 58 Q98 60 94 80 Z" fill="#0B0D1E"/>
      <circle cx="150" cy="40" r="16" fill="#0B0D1E"/>
      <!-- face: eye + smile, looking right -->
      <circle cx="120" cy="80" r="5" fill="#0B0D1E"/>
      <circle cx="142" cy="80" r="5" fill="#0B0D1E"/>
      <circle cx="121.8" cy="78.2" r="1.6" fill="#FFFFFF"/>
      <circle cx="143.8" cy="78.2" r="1.6" fill="#FFFFFF"/>
      <path d="M115 71 Q120 68 125 70" fill="none" stroke="#0B0D1E" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M137 70 Q142 68 147 71" fill="none" stroke="#0B0D1E" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="114" cy="92" r="5" fill="#F87171" opacity="0.35"/>
      <circle cx="146" cy="92" r="5" fill="#F87171" opacity="0.35"/>
      <path d="M123 93 Q131 100 139 93" fill="none" stroke="#0B0D1E" stroke-width="3" stroke-linecap="round"/>
      <!-- stethoscope -->
      <path d="M106 128 Q100 190 122 196 Q144 190 138 128" fill="none" stroke="#6C63FF" stroke-width="5" stroke-linecap="round"/>
      <circle cx="122" cy="200" r="9" fill="#6C63FF"/>
    </g>
  </svg>
</div>
</body>
</html>
